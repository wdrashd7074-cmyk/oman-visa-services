<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الطلبات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#20302b;font-family:Tahoma,Arial,sans-serif;line-height:1.7}header{background:#123b35;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1150px;margin:auto;padding:28px 4%}.panel{background:white;border:1px solid #dce4de;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px}input,select{width:100%;padding:11px;border:1px solid #ccd7cf;border-radius:8px;font:inherit}button,.btn{background:#d9b66f;color:#20372f;border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e7ece8}button:disabled{opacity:.5;cursor:not-allowed}.msg{padding:10px;background:#fff6dc;border-radius:8px;margin-top:12px}.hidden{display:none}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:10px;border-bottom:1px solid #e2e7e3;vertical-align:top}th{background:#f1f5f1}td select{min-width:140px}.small{color:#65746d;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><header><strong>خدمات تأشيرات عُمان — لوحة الإدارة</strong><a class="btn" href="/">العودة للموقع</a></header><main>
<section class="panel" id="loginPanel"><h1>دخول الإدارة</h1><p class="small">هذه الصفحة محمية بتسجيل الدخول من الخادم.</p><form id="loginForm"><div class="grid"><div><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required></div><div><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div></div><p><button type="submit">تسجيل الدخول</button></p></form><div id="loginMsg" class="msg hidden" role="status"></div></section>
<section class="panel hidden" id="dashboard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1 style="margin-bottom:0">الطلبات</h1><p class="small">لا تشارك هذه الصفحة أو بيانات العملاء مع أشخاص غير مخولين.</p></div><div><button id="refreshBtn" class="secondary">تحديث</button> <button id="logoutBtn" class="secondary">خروج</button></div></div><div id="dashMsg" class="msg hidden" role="status"></div><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>تاريخ الاستلام</th><th>العميل والتواصل</th><th>الخدمة</th><th>التفاصيل</th><th>الحالة</th><th>واتساب</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script src="/admin.js" defer></script></body></html>
